name: Publish to NPM

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # v4'ler Node.js 20 hedefliyor; GitHub 20'yi kullanimdan kaldirdi ve
      # onlari zorla Node 24'te calistiriyor. Zorlama bugun calisiyor ama
      # desteklenmeyen bir birlesim — v5'ler Node 24'u kendileri hedefliyor.
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # package.json `engines` >= 24 istiyor; 18.18 ile npm EBADENGINE
          # uyarisi veriyor ve iki dosya birbiriyle celisiyordu.
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm install

      # Tek kapi: tokens -> kontrast -> typecheck -> lint -> kapsam -> build
      # -> boyut butcesi. Adimlar ayri ayri listelendiginde yeni bir kapi
      # (kontrast, kapsam, boyut) eklendiginde CI'a yazilmasi UNUTULUYOR ve
      # yerelde kirmizi olan bir sey yayimlanabiliyordu.
      #
      # GORSEL REGRESYON BURADA DEGIL: ekran goruntusu platforma bagli ve
      # referanslar macOS'te uretildi (bkz. playwright.config.ts).
      - name: Verify
        run: npm run verify

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
