name: Publish to NPM

on:
  push:
    branches:
      - master

jobs:
  # ⚠ Kapi TEK YERDE: `ci.yml`.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      # ⚠ SURUM DEPOLAR ARASI TEK OLMALI.
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # package.json `engines` >= 24 istiyor; 18.18 ile npm EBADENGINE uyarisi veriyor
          # ve iki dosya birbiriyle celisiyordu.
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm install

      # Tek kapi: tokens -> kontrast -> typecheck -> lint -> kapsam -> build -> boyut
      # butcesi.
      - name: Verify
        run: npm run verify

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
