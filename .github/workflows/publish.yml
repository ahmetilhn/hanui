name: Publish to NPM

on:
  push:
    branches:
      - master

jobs:
  # ⚠ Kapi TEK YERDE: `ci.yml`. Adimlari buraya kopyalamak, yeni bir kapi
  # eklendiginde iki dosyadan birine yazilmamasi demekti — asagidaki
  # "Verify" yorumu bu tuzagi zaten anlatiyordu, ama `verify`nin ETRAFINDAKI
  # adimlar (format) yine ikizlenirdi.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      # ⚠ SURUM DEPOLAR ARASI TEK OLMALI. Bu depo bir donem `v5`te kaldi;
      # kalan alti depo (`hanparca-{backend,frontend,admin,crawler,cdn,infra}`)
      # `v7` kullaniyordu. Ayni is akisinin iki farkli runtime'da kosmasi,
      # yalnizca burada goruleecek bir arizanin kaynagi olur.
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # package.json `engines` >= 24 istiyor; 18.18 ile npm EBADENGINE
          # uyarisi veriyor ve iki dosya birbiriyle celisiyordu.
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm install

      # Tek kapi: tokens -> kontrast -> typecheck -> lint -> kapsam -> build
      # -> boyut butcesi. Adimlar ayri ayri listelendiginde yeni bir kapi
      # (kontrast, kapsam, boyut) eklendiginde CI'a yazilmasi UNUTULUYOR ve
      # yerelde kirmizi olan bir sey yayimlanabiliyordu.
      #
      # GORSEL REGRESYON BURADA DEGIL: ekran goruntusu platforma bagli ve
      # referanslar macOS'te uretildi (bkz. playwright.config.ts).
      - name: Verify
        run: npm run verify

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
